[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "la-nostra-citta"
version = "0.1.0"
description = "Piattaforma civica per segnalazioni urbane documentate"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "Flask-Migrate>=4.1,<5",
    "Flask-SQLAlchemy>=3.1,<4",
    "mysql-connector-python>=9,<10",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"